name: Folgen prüfen
on:
  push:
  pull_request:
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: folgen.json und Zeitberechnung prüfen
        run: node tests/pruefe-folgen.mjs
