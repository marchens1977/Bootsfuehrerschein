<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001a42">
  <title>Bootsführerschein-Podcast</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="kopf">
    <h1><span aria-hidden="true">⚓</span> Bootsführerschein-Podcast</h1>
    <button id="menueKnopf" class="klein" aria-label="Menü">☰</button>
  </header>

  <div id="menue" class="menue" hidden>
    <button id="exportKnopf">💾 Fortschritt sichern (Export)</button>
    <label class="knopf-label">📂 Fortschritt einlesen (Import)
      <input id="importDatei" type="file" accept="application/json,.json" hidden>
    </label>
    <p class="hinweis" id="speicherInfo"></p>
  </div>

  <main>
    <button id="weiterhoeren" class="weiterhoeren" hidden>
      <span class="wh-oben">▶ Weiterhören</span>
      <span class="wh-titel" id="whTitel"></span>
      <span class="wh-zeit" id="whZeit"></span>
    </button>

    <section id="player" class="player" hidden>
      <div class="p-bereich" id="pBereich"></div>
      <div class="p-titel" id="pTitel"></div>
      <div class="p-meldung" id="pMeldung" hidden></div>
      <input id="pBalken" class="balken" type="range" min="0" max="1000" value="0" aria-label="Position in der Folge">
      <div class="p-zeiten"><span id="pZeit">0:00</span><span id="pRest">-0:00</span></div>
      <div class="p-knoepfe">
        <button id="kVorige" class="rund" aria-label="Vorige Folge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="2.6" height="14" rx="1"/><path d="M19 5.8v12.4a.8.8 0 0 1-1.2.7L9 12.7a.8.8 0 0 1 0-1.4l8.8-6.2a.8.8 0 0 1 1.2.7z"/></svg>
        </button>
        <button id="kZurueck" class="rund sprung" aria-label="15 Sekunden zurück">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="linie"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M6.5 2.8v4.2h4.2"/></svg><span>15</span>
        </button>
        <button id="kPlay" class="rund gross" aria-label="Abspielen">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="i-play"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.9l10.6-6.8a1 1 0 0 0 0-1.8L9.5 4.3A1 1 0 0 0 8 5.2z"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></svg>
        </button>
        <button id="kVor" class="rund sprung" aria-label="15 Sekunden vor">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="linie"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M17.5 2.8v4.2h-4.2"/></svg><span>15</span>
        </button>
        <button id="kNaechste" class="rund" aria-label="Nächste Folge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="16.4" y="5" width="2.6" height="14" rx="1"/><path d="M5 5.8v12.4a.8.8 0 0 0 1.2.7l8.8-6.2a.8.8 0 0 0 0-1.4L6.2 5.1A.8.8 0 0 0 5 5.8z"/></svg>
        </button>
      </div>
      <div class="p-optionen">
        <div class="tempo" role="group" aria-label="Geschwindigkeit">
          <button data-tempo="0.8">0,8x</button>
          <button data-tempo="1">1x</button>
          <button data-tempo="1.25">1,25x</button>
          <button data-tempo="1.5">1,5x</button>
        </div>
        <div class="schalter">
          <button id="kAutoWeiter" class="umschalter">Automatisch weiter</button>
          <button id="kWiederholen" class="umschalter">Folge wiederholen</button>
        </div>
      </div>
    </section>

    <nav class="filter" role="group" aria-label="Bereich filtern">
      <button data-filter="Alle" class="aktiv">Alle</button>
      <button data-filter="Basis">Basis</button>
      <button data-filter="See">See</button>
      <button data-filter="Binnen">Binnen</button>
    </nav>

    <ul id="liste" class="liste"></ul>
    <p id="listeMeldung" class="hinweis"></p>
  </main>

  <audio id="audio" preload="metadata"></audio>

  <script src="js/zeitleiste.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
